<header class="sheet-ink sticky top-0 z-50 border-b border-gold/40">
  <nav
    class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8"
    aria-label="Main"
  >
    <div class="flex justify-between items-center h-18">
      <!-- Logo -->
      <a
        href="{{ '/' | relative_url }}"
        class="flex items-center gap-3 py-2 transition-opacity hover:opacity-85"
      >
        <img
          src="{{ site.app_icon | relative_url }}"
          alt=""
          width="596"
          height="541"
          class="h-9 w-auto"
        />
        <span class="display text-xl text-conch">{{ site.app_name }}</span>
      </a>

      <!-- Mobile menu button -->
      <button
        id="menu-toggle"
        type="button"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
        class="md:hidden -mr-2 p-2.5 rounded-md text-conch hover:text-gold"
      >
        <svg
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            id="menu-icon-open"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M4 7h16M4 12h16M4 17h16"
          />
          <path
            id="menu-icon-close"
            class="hidden"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>

      <!-- Desktop nav -->
      <div class="hidden md:flex items-center gap-8">
        {% for item in site.data.nav %}
        <a
          href="{{ item.url | relative_url }}"
          class="py-3 text-base text-ink-soft hover:text-conch aria-[current=page]:text-conch transition-colors"
          {% if page.url == item.url %}aria-current="page"{% endif %}
          >{{ item.title }}</a
        >
        {% endfor %}
      </div>
    </div>

    <!-- Mobile nav -->
    <div id="mobile-menu" class="hidden md:hidden pb-4">
      <div class="flex flex-col border-t border-gold/30">
        {% for item in site.data.nav %}
        <a
          href="{{ item.url | relative_url }}"
          class="py-3.5 border-b border-gold/20 text-lg text-conch"
          {% if page.url == item.url %}aria-current="page"{% endif %}
          >{{ item.title }}</a
        >
        {% endfor %}
      </div>
    </div>
  </nav>
</header>

<script>
  document.getElementById("menu-toggle").addEventListener("click", function () {
    var menu = document.getElementById("mobile-menu");
    var open = menu.classList.toggle("hidden") === false;
    this.setAttribute("aria-expanded", String(open));
    document.getElementById("menu-icon-open").classList.toggle("hidden", open);
    document.getElementById("menu-icon-close").classList.toggle("hidden", !open);
  });
</script>
