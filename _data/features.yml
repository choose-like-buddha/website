# Homepage feature grid, in display order.
#
# Ordered by reason-to-install, not by recency. The differentiators lead;
# supporting features (reminders, Health sync) come last — those matter to people
# who already use the app, not to someone deciding whether to download it.
# The grid is 4-up on large screens, so positions 1-4 are the visible row.
#
# Rewritten when the app moved from a scored quiz to a daily practice. The old
# grid promised eight concepts, an explanation after each answer, levels, and
# badges for accuracy and category mastery — the app has none of those now.
# Every claim here should be checkable against constants/practice-concepts.ts,
# constants/achievements.ts and constants/breathing.ts.

- title: Ask Buddha
  description: Ask Buddha any question and get a mindful perspective in response, based on the teachings of Buddhism.
  icon: flower-lotus

- title: Five Practice Concepts
  description: Right Speech, Kindness, Patience, Letting Go and Mindfulness — five threads of practice you return to a little at a time.
  icon: compass

- title: Patterns
  description: See where you actually lean between two honest options, and how what you are watching for has moved over the past month.
  icon: chart-line-up

- title: Four Breathing Techniques
  description: Practice Sama, Ānāpānasati, Mettā, and Vase breathing — guided rhythms rooted in Buddhist tradition.
  icon: wind

- title: One Minute a Day
  description: One short session — a check-in, something you already did, and something you might. No scores, no right answers.
  icon: lightbulb

- title: Achievement Badges
  description: Unlock 27 mandala badges for streaks, daily practice, breathing, reflections and Ask Buddha milestones.
  icon: medal

- title: Daily Reminders
  description: Gentle reminders help you build a small, consistent reflection habit.
  icon: bell

- title: Apple Health Sync
  description: Save every breathing session to Apple Health as mindful minutes — optional on iOS, and never reads your health data.
  icon: heartbeat
