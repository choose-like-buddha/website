# Shared FAQ, rendered by _includes/faq.html on the homepage, /pricing/ and
# /contact/, and emitted as FAQPage structured data.
#
# `PREMIUM_PRICE` is substituted with site.premium_price at render time — Liquid
# does not interpolate inside _data files, and hardcoding the price here is what
# let it drift to a stale $4.99. Keep the token; don't write the number.
#
# Feature limits must match the app's constants/subscription.ts and
# constants/breathing.ts.

# `tags` controls which pages show a question:
#   pricing  — shown on /pricing/
#   home     — shown on the homepage
# /contact/ always shows all of them.
- q: Is Choose Like Buddha free?
  a: "Yes. The Free Path is free forever and includes the full daily practice, 2 Ask Buddha questions a day, Sama (Box) breathing, and your Patterns, reflections, streaks and badges. There are no ads, and no account is required."
  tags: [pricing, home]

- q: Do I need to be Buddhist to use it?
  a: "No. The app uses Buddhist ideas as a practical lens for everyday decisions, not as religious instruction. No prior knowledge is needed, and nothing in the app asks you to adopt a belief."
  tags: [home]

- q: What is Ask Buddha?
  a: "Ask Buddha lets you describe any real-life situation and receive thoughtful guidance inspired by Buddhist wisdom. Free users get 2 questions a day and keep their 7 most recent answers; the Enlightened Path raises that to 20 a day and keeps the full history."
  tags: [home]

- q: Is Ask Buddha a therapist?
  a: "No. Ask Buddha offers a calm, reflective perspective generated by AI, and it is not a substitute for therapy, counselling, or medical advice. If you are struggling, please speak to a qualified professional."
  tags: [home]

- q: What is the Enlightened Path?
  a: "The Enlightened Path is the optional premium plan at PREMIUM_PRICE a month. It raises Ask Buddha from 2 questions a day to 20, keeps your full Ask Buddha history rather than the last 7, and unlocks all four breathing techniques. The daily practice itself is the same on both plans."
  tags: [pricing, home]

- q: How do I cancel my subscription?
  a: "Cancel any time from your Apple App Store or Google Play account settings. Billing is handled by the store rather than by us, and premium features stay active until the end of the period you have paid for."
  tags: [pricing]

- q: Is there an annual plan?
  a: "Not currently. Only a monthly subscription is offered, and there is no one-time purchase."
  tags: [pricing]

- q: Is my data private?
  a: "Choose Like Buddha is ad-free and does not share your personal data with other users. See our Privacy Policy for the full detail of what is collected and why."
  tags: [home]

- q: What are the five practice concepts?
  a: "The practice moves through five concepts: Right Speech, Kindness, Patience, Letting Go, and Mindfulness. Each day you meet one item from each, and Patterns shows where you lean within them."

- q: I found a bug. How do I report it?
  a: 'Send an email to <a href="mailto:chooselikebuddha@gmail.com" class="text-primary hover:text-primary-dark hover:underline">chooselikebuddha@gmail.com</a> with a description of the issue and your device type. We appreciate the help.'
